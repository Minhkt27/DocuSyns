version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: docusync_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docusync_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: docusync_backend
    volumes:
      - ./storage_data:/app/local_storage
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/docusync_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres

  sidecar:
    build: ./sidecar-golang
    container_name: docusync_sidecar
    ports:
      - "8081:8081"
    volumes:
      - ./sidecar-golang/sync_folder:/app/sync_folder
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:8080

  nginx:
    image: nginx:1.25-alpine
    container_name: docusync_nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - backend

volumes:
  postgres_data:
