# Server configuration
server.port=8080

# Spring Application
spring.application.name=DocuSync

# PostgreSQL DataSource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/docusync_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT signing secret - required, no insecure default. Set via JWT_SECRET env var.
jwt.secret=${JWT_SECRET}

# CORS - comma-separated list of allowed origins. Empty by default (desktop client is not subject to CORS).
docusync.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Default password for seeded demo accounts (admin/pm/employee). Override before any real deployment.
docusync.seed.default-password=${SEED_DEFAULT_PASSWORD:123456}

# JPA & Hibernate Properties
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
