events {
    worker_connections 1024;
}

http {
    # Logging format to include real IP, time, request, status, user agent, etc.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # Access log location (mounted to a volume for persistence)
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    server {
        listen 8080;
        server_name localhost;

        # Route API requests to the Java Backend
        location /api/ {
            proxy_pass http://backend:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Allow large file uploads (500MB as per Spring Boot config)
            client_max_body_size 500M;
        }

        # WebSocket endpoint sidecars connect to for real-time down-sync
        # notifications - needs the Upgrade/Connection headers forwarded,
        # unlike the plain HTTP proxying above.
        location /ws/ {
            proxy_pass http://backend:8080/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 3600s;
        }

        # Optional: Route sidecar or other services if needed
        # location /sidecar/ {
        #     proxy_pass http://sidecar:8081/;
        # }

        # Serve static files for app updates
        location /downloads/ {
            alias /var/www/downloads/;
            autoindex off;
        }
    }
}
