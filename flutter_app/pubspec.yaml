name: docusync_client
description: Flutter client for DocuSync with Sidecar
publish_to: 'none'
version: 2.1.3+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  file_picker: ^8.0.7
  flutter:
    sdk: flutter
  google_fonts: ^8.2.1
  http: ^1.1.0
  intl: ^0.20.3
  http_parser: ^4.1.2
  flutter_secure_storage: ^9.2.2
  package_info_plus: ^9.0.1
  path_provider: ^2.1.6
  dio: ^5.11.0
  open_filex: ^4.7.0
  provider: ^6.1.2

flutter:
  uses-material-design: true

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
